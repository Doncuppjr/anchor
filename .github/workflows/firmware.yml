name: ANCHOR multi-board firmware
# Build signed-off production/debug artifacts and publish the generated browser installer.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'refactor/**'
    paths:
      - 'firmware/**'
      - 'boards/**'
      - 'Makefile'
      - 'tests/**'
      - 'installer/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'boards/**'
      - 'Makefile'
      - 'tests/**'
      - 'installer/**'
      - '.github/workflows/firmware.yml'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.board }} / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        board: [c5, c3-supermini]
        variant: [production, debug]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.6.0'

      - name: Install pinned ESP32 board platform
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@4.0.0 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core list

      - name: Test trainer framing parser (host compiler)
        run: |
          make test

      - name: Build ANCHOR application image
        run: make build BOARD=${{ matrix.board }} PROFILE=${{ matrix.variant }}

      - name: Verify build profile and package
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
          BOARD: ${{ matrix.board }}
        run: |
          set -euo pipefail
          case "$BOARD" in
            c5) prefix=ANCHOR-C5; size=8388608; slot=$((0x300000)); boot=0x2000; fqbn=esp32:esp32:XIAO_ESP32C5 ;;
            c3-supermini) prefix=ANCHOR-C3-SUPERMINI; size=4194304; slot=$((0x1F0000)); boot=0; fqbn=esp32:esp32:esp32c3:PartitionScheme=no_fs,CDCOnBoot=cdc ;;
            *) exit 2 ;;
          esac
          out="dist/$BOARD/$VARIANT"
          app="$out/$prefix-$VARIANT-app.bin"
          full="$out/$prefix-$VARIANT-full.bin"
          test -s "$app"
          test "$(stat -c %s "$full")" -eq "$size"
          test "$(stat -c %s "$app")" -le "$slot"
          python3 - "$app" "$full" "$boot" <<'PYVERIFY'
          from pathlib import Path
          import sys
          app = Path(sys.argv[1]).read_bytes()
          full = Path(sys.argv[2]).read_bytes()
          assert full[int(sys.argv[3],0)] == 0xe9, 'bootloader magic missing'
          assert full[0x8000:0x8002] == bytes([0xaa, 0x50]), 'partition magic missing'
          assert full[0x10000:0x10000+len(app)] == app, 'app differs from merged image'
          PYVERIFY
          if [[ "$VARIANT" == production ]]; then
            ! grep -aFq 'INJECTED_DISCONNECT previouslyConnected' "$app"
            ! grep -aFq 'TELEMTEST queued=' "$app"
          else
            grep -aFq 'INJECTED_DISCONNECT previouslyConnected' "$app"
            grep -aFq 'TELEMTEST queued=' "$app"
          fi
          grep -aFq 'AT+OTA' "$app"
          grep -aFq 'ANCHOR Chain' "$app"
          (
            cd "$out"
            sha256sum "$prefix-$VARIANT-app.bin" "$prefix-$VARIANT-full.bin" > SHA256SUMS
            printf 'git_commit=%s\nvariant=%s\nboard=%s\narduino_cli=1.6.0\nesp32_core=4.0.0\n' \
              "$GITHUB_SHA" "$VARIANT" "$fqbn" > BUILD-METADATA.txt
          )

      - name: Upload USB and OTA firmware
        uses: actions/upload-artifact@v4
        with:
          name: ANCHOR-${{ matrix.board }}-${{ matrix.variant }}-${{ github.sha }}
          path: |
            dist/${{ matrix.board }}/${{ matrix.variant }}/*-app.bin
            dist/${{ matrix.board }}/${{ matrix.variant }}/*-full.bin
            dist/${{ matrix.board }}/${{ matrix.variant }}/SHA256SUMS
            dist/${{ matrix.board }}/${{ matrix.variant }}/BUILD-METADATA.txt
          if-no-files-found: error
          retention-days: 30

  installer:
    permissions:
      contents: read
      pages: write
      id-token: write
    name: Package browser installer
    outputs:
      pages_enabled: ${{ steps.pages_check.outputs.enabled }}
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout installer source
        uses: actions/checkout@v4
      - name: Download firmware images
        uses: actions/download-artifact@v4
        with:
          pattern: ANCHOR-*-${{ github.sha }}
          path: dist
          merge-multiple: false
      - name: Arrange downloaded firmware variants
        shell: bash
        run: |
          set -euo pipefail
          for board in c5 c3-supermini; do
            for variant in production debug; do
              d="dist/ANCHOR-$board-$variant-${GITHUB_SHA}"
              test -f "$d/BUILD-METADATA.txt"
              mkdir -p "dist/$board/$variant"
              cp "$d/"* "dist/$board/$variant/"
            done
          done
      - name: Create GitHub Pages site
        run: python3 installer/generate-site.py --dist dist --output site --version "${GITHUB_SHA:0:12}" --boards c5 c3-supermini
        shell: bash
      - name: Check installer files
        run: |
          test -f site/index.html
          test -f site/boards.json
          for board in c5 c3-supermini; do
            test -f "site/$board/production/manifest.json"
            test -f "site/$board/debug/manifest.json"
          done
      - name: Test multi-board installer selector and manifests
        run: python3 -m unittest discover -s tests -p test_installer.py -v
      - name: Publish installer site artifact
        uses: actions/upload-artifact@v4
        with:
          name: ANCHOR-browser-installer-${{ github.sha }}
          path: site/
          if-no-files-found: error
          retention-days: 30
      - name: Check whether GitHub Pages is enabled
        id: pages_check
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if curl --silent --show-error --fail --retry 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages not enabled. Installer artifact was uploaded; enable Pages with GitHub Actions as source to publish it."
          fi
      - name: Configure GitHub Pages
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    permissions:
      pages: write
      id-token: write
    name: Deploy browser installer
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.installer.outputs.pages_enabled == 'true'
    needs: installer
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
